# 打 tag 就把安装包挂到对应的版本（Release）上。
#
# 为什么这件事放在流水线里，而不是本地用 cnb 命令行做：
#   cnb CLI 走 OAuth2 设备授权流，客户端固定是 cnb_cli，它签出来的令牌
#   没有、也申请不到 repo-release:rw（直接拿设备流申请会被服务端回
#   invalid_scope），所以本地建不了版本、也改不了仓库信息。
#   而 tag_push 属于「可信事件」，流水线里的 CNB_TOKEN 天生带这个权限。
#
# 这个仓库有**两条线**，标签格式就是它们的身份：
#   v2.8.1 这种（v*）      —— Electron 版，安装包在 installers/ 里，走流水线挂上去
#   2.8.0-go 这种（*-go）  —— Go 版，单 exe 十几 MB，由作者自己从网页上传
# 下面每个 stage 都按这个区分来分流，别把两条线混在一起处理 ——
# 混的后果是真实的：Go 版的包删掉就没了（手工传的，仓库里没有第二份），
# 而 Electron 那版要长期可下载。
#
# 发下一个版本的动作清单：
#   Electron 版：
#     1. npm version 升版本号、打包，把新安装包拷进 installers/，删掉上一版的包
#     2. 版本说明写到 docs/releases/<tag>.md（页面上的内容就是它）
#     3. git commit -am "..." && git push
#     4. git tag -a v2.8.1 -m "..." && git push origin refs/tags/v2.8.1
#   Go 版：
#     1. 构建出单 exe（比 64 MB 的网页上传上限小得多，不需要进仓库、不需要 LFS）
#     2. 版本说明写到 docs/releases/<tag>.md
#     3. git tag -a 2.8.0-go -m "..." && git push origin refs/tags/2.8.0-go
#        —— 这一步只会把版本页建出来，附件留给你在网页上手工传
#
# 注：标签一旦推上去，本地就删不掉了（`cnb git delete-tag` 要 repo-release:rw，
# 本地令牌没有；流水线的可信令牌可以，但要另开一条 api_trigger 流水线）。
# 要重跑流水线，稳妥办法是推一个新标签。
#
# 关于存储 —— 2026-09-23 实测，别再凭感觉估：
#   对象存储用量 = Git LFS 对象 + Release 附件，同一份安装包被算了**两份**。
#   拿所有版本的文件大小求和，正好等于用量页面上的数字（差 3.9 KB 元数据）。
#   附件那一份由最后那个「清理旧版本」stage 每发一版回收一次。
#   LFS 那一份**回收不掉**：对象按 OID 存在服务端，只要还有 ref（标签）指向
#   含该指针文件的提交，它就得留着。所以 LFS 会按一版约 106 MB 单向增长。
#   免费额度 100 GiB，眼下远够用 —— 但别再往仓库里塞第二份大文件。
#   Go 版不进仓库，这条增长曲线到 2.8.0 为止。

$:
  tag_push:
    - stages:
        - name: 取安装包
          script: |
            set -e
            # Go 版：包不进仓库，没什么可取的。把 installers/ 清掉还有第二个用处 ——
            # 万一下面「挂安装包」那个 if 没生效，glob 匹配不到文件，也挂不上东西。
            # 清掉的只是流水线工作区里的一份克隆，不影响仓库。
            case "$CNB_BRANCH" in
              *-go)
                echo "标签 $CNB_BRANCH 是 Go 版：不取安装包（包由作者手工上传）"
                rm -f installers/*.exe
                exit 0
                ;;
            esac

            git lfs install --local || true
            git lfs pull || true
            ls -lh installers/
            # 只拿到 LFS 指针的话后面必然失败，早点报出来，别等到上传阶段
            if head -c 20 installers/*.exe | grep -q "version https://git-lfs"; then
              echo "安装包还是 LFS 指针，没拉到实体文件"; exit 1
            fi

        - name: 建版本
          script: |
            set -e
            # 版本说明优先用 docs/releases/<tag>.md，没有就退回 tag 的附注信息
            NOTES="docs/releases/${CNB_BRANCH}.md"
            if [ -f "$NOTES" ]; then
              BODY=$(cat "$NOTES")
            else
              BODY="${CNB_TAG_MESSAGE:-$CNB_BRANCH}"
            fi

            # Go 版目前是骨架（云端功能还没接通），标成预发布，也别占「最新版」——
            # Releases 页的「最新」要留给功能完整的 Electron 版 v2.8.0。
            # 哪天 Go 版能正常传文件了，把这两个标志翻回来。
            case "$CNB_BRANCH" in
              *-go) PRERELEASE=true;  LATEST=false ;;
              *)    PRERELEASE=false; LATEST=true  ;;
            esac

            # 字段名以 OpenAPI 的 openapi.PostReleaseForm 为准：
            # 是 draft / prerelease，不是 is_draft / is_prerelease
            #（官方 issue 里那份示例写成 is_xxx，会被服务端静默忽略）
            PAYLOAD=$(jq -n \
              --arg name "$CNB_BRANCH" \
              --arg body "$BODY" \
              --arg tag  "$CNB_BRANCH" \
              --arg sha  "$CNB_BRANCH_SHA" \
              --arg pre  "$PRERELEASE" \
              --arg latest "$LATEST" \
              '{name:$name, body:$body, draft:false,
                prerelease:($pre=="true"), make_latest:$latest,
                tag_name:$tag, target_commitish:$sha}')

            URL="${CNB_API_ENDPOINT}/${CNB_REPO_SLUG}/-/releases"
            CODE=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST "$URL" \
              -H "Authorization: Bearer ${CNB_TOKEN}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/vnd.cnb.api+json" \
              -d "$PAYLOAD")
            echo "POST $URL -> HTTP $CODE"
            cat /tmp/resp.json; echo
            # 同一个 tag 重跑会撞「版本已存在」，那不算错，别把流水线搞红
            case "$CODE" in
              2*) echo "版本已就绪";;
              *)  echo "创建版本没成功（HTTP $CODE）；若提示已存在可忽略";;
            esac

        # attachments 插件只能把附件挂到「已经存在」的版本上，所以顺序不能颠倒。
        #
        # 只有 Electron 版（v* 标签）才挂附件。Go 版必须跳过 —— installers/ 里
        # 那份是 Electron 的安装包，挂上去等于给 Go 版本配了个 106 MB 的 Electron
        # 安装程序，用户下下来会一脸问号。
        - name: 挂安装包
          if: |
            case "$CNB_BRANCH" in *-go) exit 1 ;; esac
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./installers/*.exe"

        # 清理本线历次版本的安装包，只留当前这一版。
        #
        # 为什么非清不可：同一份安装包在对象存储里存了两份 —— 一份是 Git LFS 的对象，
        # 一份是 Release 附件（attachments 插件是重新上传，不是引用 LFS 对象）。
        # 实测两者字节数完全相等，用量页面把两份加在一起算。附件这份是可以回收的，
        # 不清就会一版一版堆下去（2026-09-23 清掉了 6 个旧版本、约 330 MiB）。
        #
        # **只清同一条线上的**，这是这个 stage 最要紧的一条规则：
        # 原先按「只留 is_latest」来删，两条线一起存在时就会互相删 ——
        # 推 2.8.0-go 会把 v2.8.0（Electron）删掉，推 v2.8.1 又会把 2.8.0-go 删掉，
        # 而 Go 版的包是作者手工上传的，删掉就没了。
        #
        # 清理失败不能让发版变红，所以脚本哪里出错都走 exit 0。
        - name: 清理旧版本
          script: |
            case "$CNB_BRANCH" in
              *-go) MY_LINE=go ;;
              *)    MY_LINE=v ;;
            esac
            # 标签名拿不到就什么都不删 —— 判断依据全靠它，空值会把整条线误删
            if [ -z "$CNB_BRANCH" ]; then echo "拿不到 CNB_BRANCH，为安全起见不删任何东西"; exit 0; fi

            URL="${CNB_API_ENDPOINT}/${CNB_REPO_SLUG}/-/releases"
            curl -sS "$URL?pageSize=100" \
              -H "Authorization: Bearer ${CNB_TOKEN}" \
              -H "Accept: application/vnd.cnb.api+json" \
              -o /tmp/list.json || { echo "拉版本列表失败，跳过清理"; exit 0; }

            # 注意：这个接口返回的是**裸数组**，不是 {data:[...]}。
            # cnb CLI 打印出来的 data: 那层信封是它自己加的，照它写 jq 会报
            # "Cannot index array with string \"data\""。
            #
            # jq 只负责把「id + 标签名」拆成两列 —— 这个写法在 v2.8.0 发版时跑通过。
            # 挑哪条线、留哪一版都在 shell 里判断，免得往 jq 里塞它版本不支持的函数。
            jq -r '.[] | "\(.id)\t\(.tag_name)"' /tmp/list.json |
            while IFS="$(printf '\t')" read -r RID TAG; do
              [ -z "$RID" ] && continue
              [ "$TAG" = "$CNB_BRANCH" ] && { echo "保留当前版本 ${TAG}"; continue; }
              case "$TAG" in
                *-go) ITS_LINE=go ;;
                *)    ITS_LINE=v ;;
              esac
              [ "$ITS_LINE" = "$MY_LINE" ] || { echo "跳过其它线：${TAG}"; continue; }

              CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE "$URL/$RID" \
                -H "Authorization: Bearer ${CNB_TOKEN}" \
                -H "Accept: application/vnd.cnb.api+json")
              echo "删除旧版本 $TAG -> HTTP $CODE"
            done
            exit 0
