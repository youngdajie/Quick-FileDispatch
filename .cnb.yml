# 打 tag 就把安装包挂到对应的版本（Release）上。
#
# 为什么这件事放在流水线里，而不是本地用 cnb 命令行做：
#   cnb CLI 走 OAuth2 设备授权流，客户端固定是 cnb_cli，它签出来的令牌
#   没有、也申请不到 repo-release:rw（直接拿设备流申请会被服务端回
#   invalid_scope），所以本地建不了版本、也改不了仓库信息。
#   而 tag_push 属于「可信事件」，流水线里的 CNB_TOKEN 天生带这个权限。
#
# 前提：installers/ 下放着这一版的安装包。它走 Git LFS 存，所以仓库本体
# 不会被撑大（LFS 对象占对象存储额度，免费 100 GiB）。
# 一个版本只放一个包，发新版时把上一个删掉，这样下面的 glob 永远只匹配到一个文件
# —— 否则给 v2.5.0 发版时会把 v2.4.0 的包也一起挂上去。
#
# 发下一个版本的动作清单：
#   1. npm version 升版本号、打包，把新安装包拷进 installers/，删掉上一版的包
#   2. 版本说明写到 docs/releases/<tag>.md（页面上的内容就是它）
#   3. git commit -am "..." && git push
#   4. git tag -a v2.5.0 -m "..." && git push origin refs/tags/v2.5.0
# 第 4 步一推，这里就自动跑起来。
#
# 注：标签一旦推上去就删不掉了（服务端 hook 会拒），要重跑流水线只能改配置再推新标签。
#
# 关于存储 —— 2026-09-23 实测，别再凭感觉估：
#   对象存储用量 = Git LFS 对象 + Release 附件，同一份安装包被算了**两份**。
#   拿所有版本的文件大小求和，正好等于用量页面上的数字（差 3.9 KB 元数据）。
#   附件那一份由最后那个「清理旧版本」stage 每发一版回收一次，只留最新一版。
#   LFS 那一份**回收不掉**：对象按 OID 存在服务端，只要还有 ref（标签）指向
#   含该指针文件的提交，它就得留着；而标签删不掉（见上一条）。所以 LFS 会按
#   一版约 106 MB 单向增长。免费额度 100 GiB，眼下远够用 —— 但别再往仓库里
#   塞第二份大文件（例如顺手把 unpacked 目录也提交了）。

$:
  tag_push:
    - stages:
        - name: 取安装包
          script: |
            set -e
            git lfs install --local || true
            git lfs pull || true
            ls -lh installers/
            # 只拿到 LFS 指针的话后面必然失败，早点报出来，别等到上传阶段
            if head -c 20 installers/*.exe | grep -q "version https://git-lfs"; then
              echo "安装包还是 LFS 指针，没拉到实体文件"; exit 1
            fi

        - name: 建版本
          script: |
            set -e
            # 版本说明优先用 docs/releases/<tag>.md，没有就退回 tag 的附注信息
            NOTES="docs/releases/${CNB_BRANCH}.md"
            if [ -f "$NOTES" ]; then
              BODY=$(cat "$NOTES")
            else
              BODY="${CNB_TAG_MESSAGE:-$CNB_BRANCH}"
            fi

            # 字段名以 OpenAPI 的 openapi.PostReleaseForm 为准：
            # 是 draft / prerelease，不是 is_draft / is_prerelease
            #（官方 issue 里那份示例写成 is_xxx，会被服务端静默忽略）
            PAYLOAD=$(jq -n \
              --arg name "$CNB_BRANCH" \
              --arg body "$BODY" \
              --arg tag  "$CNB_BRANCH" \
              --arg sha  "$CNB_BRANCH_SHA" \
              '{name:$name, body:$body, draft:false, prerelease:false,
                make_latest:"true", tag_name:$tag, target_commitish:$sha}')

            URL="${CNB_API_ENDPOINT}/${CNB_REPO_SLUG}/-/releases"
            CODE=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST "$URL" \
              -H "Authorization: Bearer ${CNB_TOKEN}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/vnd.cnb.api+json" \
              -d "$PAYLOAD")
            echo "POST $URL -> HTTP $CODE"
            cat /tmp/resp.json; echo
            # 同一个 tag 重跑会撞「版本已存在」，那不算错，别把流水线搞红
            case "$CODE" in
              2*) echo "版本已就绪";;
              *)  echo "创建版本没成功（HTTP $CODE）；若提示已存在可忽略";;
            esac

        # attachments 插件只能把附件挂到「已经存在」的版本上，所以顺序不能颠倒
        - name: 挂安装包
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./installers/*.exe"

        # 清理历次版本的安装包，只留这一版。
        #
        # 为什么非清不可：同一份安装包在对象存储里存了两份 —— 一份是 Git LFS 的对象，
        # 一份是 Release 附件（attachments 插件是重新上传，不是引用 LFS 对象）。
        # 实测两者字节数完全相等，用量页面把两份加在一起算。附件这份是可以回收的，
        # 不清就会一版一版堆下去（2026-09-23 清掉了 6 个旧版本、约 330 MiB）。
        #
        # 必须排在「挂安装包」之后：先把当前版本的附件挂上，再挑出要保留的那一版来删。
        # 判断依据用 is_latest 而不是写死 tag 名，重复跑是幂等的。
        #
        # 清理失败不能让发版变红，所以脚本哪里出错都走 exit 0。
        - name: 清理旧版本
          script: |
            URL="${CNB_API_ENDPOINT}/${CNB_REPO_SLUG}/-/releases"
            curl -sS "$URL?pageSize=100" \
              -H "Authorization: Bearer ${CNB_TOKEN}" \
              -H "Accept: application/vnd.cnb.api+json" \
              -o /tmp/list.json || { echo "拉版本列表失败，跳过清理"; exit 0; }

            # 注意：这个接口返回的是**裸数组**，不是 {data:[...]}。
            # cnb CLI 打印出来的 data: 那层信封是它自己加的，照它写 jq 会报
            # "Cannot index array with string \"data\""。
            KEEP=$(jq -r '.[] | select(.is_latest == true) | .tag_name' /tmp/list.json)
            if [ -z "$KEEP" ]; then
              echo "没找到 latest 版本，为安全起见不删任何东西"; exit 0
            fi
            echo "保留：${KEEP}"

            jq -r '.[] | select(.is_latest != true) | "\(.id)\t\(.tag_name)"' /tmp/list.json |
            while IFS="$(printf '\t')" read -r RID TAG; do
              CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE "$URL/$RID" \
                -H "Authorization: Bearer ${CNB_TOKEN}" \
                -H "Accept: application/vnd.cnb.api+json")
              echo "删除旧版本 $TAG -> HTTP $CODE"
            done
            exit 0
