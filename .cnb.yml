# 打 tag 一条龙：构建安装包 → 建 Release → 上传附件 → 清理旧版本。
#
# 之前是「流水线只建个空的版本页，安装包作者从网页手工传」。
# 现在整条链都在流水线里跑完，推完 tag 就有一个可以直接下载的版本。
#
# 为什么建版本放在流水线里，而不是本地用 cnb 命令行做：
#   cnb CLI 走 OAuth2 设备授权流，客户端固定是 cnb_cli，它签出来的令牌
#   没有、也申请不到 repo-release:rw（直接拿设备流申请会被服务端回
#   invalid_scope），所以本地建不了版本、也改不了仓库信息。
#   而 tag_push 属于「可信事件」，流水线里的 CNB_TOKEN 天生带这个权限。
#
# 本仓库自 3.0.0 起标签**不带任何后缀**（2.8.1~2.9.0 的 -go 过渡期结束）：
# 只有一个版本的形态，exe 十几 MB，不进仓库、不用 LFS。
# 2026-10-10 起：**Release 只保留最新一版**，旧版本（含 Electron 线 v2.8.0）
# 随新版本发布一并清理。Electron 版的源码仍在 v2.8.0 标签的 git 历史里，
# 只是不再提供安装包下载 —— 对象存储额度留给当前版本。
#
# 发一个新版本的动作清单（2026-09-26 起，附件不再需要手工传）：
#   1. main.go 升 const version
#   2. 版本说明写到 docs/releases/<tag>.md（Release 页的正文就是它）
#   3. git commit && git push
#   4. git tag -a X.Y.Z -m "..." && git push origin refs/tags/X.Y.Z
#      —— 剩下的全自动：构建 → 建版本 → 挂附件 → 清理旧版本
#   5. 去 Release 页确认安装包挂上去了（流水线绿不代表附件一定在，
#      见「上传安装包」那步的注释）
#
# 注：标签一旦推上去，本地就删不掉了（`cnb git delete-tag` 要 repo-release:rw，
# 本地令牌没有；流水线的可信令牌可以，但要另开一条 api_trigger 流水线）。
# 要重跑流水线，稳妥办法是推一个新标签。
#
# 关于存储 —— 2026-09-23 实测，别再凭感觉估：
#   对象存储用量 = Git LFS 对象 + Release 附件，历史上同一份安装包被算**两份**。
#   LFS 那一份回收不掉：对象按 OID 存在服务端，只要还有 ref（标签）指向
#   含该指针文件的提交，它就得留着。好消息是 Go 版安装包不进仓库，
#   LFS 增长曲线到 2.8.0 为止；Release 附件由「清理旧版本」每版回收一次。
#   现在附件是自动传的，一版约 23 MB（安装包 7 MB + 单 exe 16 MB）——
#   想省额度就只留安装包，把下面 attachments 里的单 exe 那行删掉。

$:
  tag_push:
    - stages:
        # ---------------------------------------------------------- 1. 构建
        #
        # 构建节点是 Linux，而产物是 Windows exe + NSIS 安装包。三件事都得解决：
        #   - Go 交叉编译（GOOS=windows）—— 原生支持，build.sh 里固定了
        #   - NSIS 在 Linux 上可用（apt 装），脚本本身是跨平台的
        #   - 图标与版本信息：原来用 rcedit，那是 Windows 程序，这里换成
        #     goversioninfo（纯 Go），build.sh 会自动装
        # build.sh 本地和这里**跑的是同一份** —— 两套构建流程必然漂移。
        - name: 构建安装包
          image: golang:1.27
          script: |
            set -e
            # nsis 不在 golang 镜像里，现装。
            # python3 是给 build.sh 里「校验资源确实嵌进了 exe」那一步用的
            # （goversioninfo 静默失败时会出一个没有图标的 exe，编译照样成功，
            #  不验就得等用户装上才发现是白板图标）。
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              nsis python3 ca-certificates

            echo "=== 版本与工具 ==="
            go version
            makensis -VERSION

            bash tools/installer/build.sh

            echo "=== 产物 ==="
            ls -lh dist-go/*.exe

        # ---------------------------------------------------------- 2. 建版本
        - name: 建版本
          script: |
            set -e
            # 版本说明优先用 docs/releases/<tag>.md，没有就退回 tag 的附注信息。
            #
            # ⚠️ 这里必须两种命名都试：**标签名带 v 前缀（v3.4.5），而文档名不带
            #    （3.4.5.md）**。只查 "${CNB_BRANCH}.md" 的话永远匹配不上
            #    （CNB_BRANCH 在 tag_push 里就是标签名），于是一直静默退回 tag 附注 ——
            #    Release 页正文从引入这步起就一直是 tag 说明，docs/releases/ 下那些
            #    写好的正文一次都没被用上（v3.4.5 发布时发现）。
            NOTES=""
            for cand in "docs/releases/${CNB_BRANCH}.md" "docs/releases/${CNB_BRANCH#v}.md"; do
              if [ -f "$cand" ]; then NOTES="$cand"; break; fi
            done
            if [ -n "$NOTES" ]; then
              echo "版本正文取自 $NOTES"
              BODY=$(cat "$NOTES")
            else
              echo "docs/releases/ 下没有对应说明，退回 tag 附注"
              BODY="${CNB_TAG_MESSAGE:-$CNB_BRANCH}"
            fi

            # 字段名以 OpenAPI 的 openapi.PostReleaseForm 为准：
            #   draft / prerelease 是布尔；make_latest 是**字符串**（"true"/"false"）——
            #   写成布尔会被服务端回 400：cannot unmarshal bool into
            #   PostReleaseForm.make_latest of type string（2026-09-23 实踩，
            #   而且「建版本」stage 的容错会把它吞成绿色，版本页根本没建出来）。
            PAYLOAD=$(jq -n \
              --arg name "$CNB_BRANCH" \
              --arg body "$BODY" \
              --arg tag  "$CNB_BRANCH" \
              --arg sha  "$CNB_BRANCH_SHA" \
              '{name:$name, body:$body, draft:false, prerelease:false,
                make_latest:"true", tag_name:$tag, target_commitish:$sha}')

            URL="${CNB_API_ENDPOINT}/${CNB_REPO_SLUG}/-/releases"
            CODE=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST "$URL" \
              -H "Authorization: Bearer ${CNB_TOKEN}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/vnd.cnb.api+json" \
              -d "$PAYLOAD")
            echo "POST $URL -> HTTP $CODE"
            cat /tmp/resp.json; echo
            # 同一个 tag 重跑会撞「版本已存在」，那不算错；除此之外的失败
            # 必须把流水线搞红 —— 2xx 就继续吞，下次发版又是静默空页面
            # 409 = 这个 tag 的版本页已经在了。
            #
            # 2026-09-26 实踩：tag 推早了一步，旧代码先跑出一版流水线，
            # 而那时 .cnb.yml 里还没有「构建」，于是它直接建出了一个**空的**
            # 版本页。等代码补上再重跑，POST 就撞 409。
            #
            # 注意服务端回的是 {"errcode":409,"errmsg":"conflict"} ——
            # 里面**没有**"已存在"字样，只 grep 文案会漏判、把流水线搞红。
            #
            # 这里不直接放行，而是**删掉重建**：已存在的那份可能是空的、
            # 正文也是旧的；重建能保证正文用的是当前 docs/releases/<tag>.md。
            if [ "$CODE" = "409" ] || grep -qE "已存在|already exist|conflict" /tmp/resp.json; then
              echo "版本已存在，删掉重建（保证正文是当前的）"
              RID=$(curl -sS "$URL?pageSize=100"                 -H "Authorization: Bearer ${CNB_TOKEN}"                 -H "Accept: application/vnd.cnb.api+json"                 | jq -r --arg t "$CNB_BRANCH" '.[] | select(.tag_name==$t) | .id' | head -1)
              if [ -n "$RID" ] && [ "$RID" != "null" ]; then
                curl -sS -o /dev/null -X DELETE "$URL/$RID"                   -H "Authorization: Bearer ${CNB_TOKEN}"                   -H "Accept: application/vnd.cnb.api+json"
                echo "  已删除旧的版本页 id=$RID"
              fi
              CODE=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST "$URL"                 -H "Authorization: Bearer ${CNB_TOKEN}"                 -H "Content-Type: application/json"                 -H "Accept: application/vnd.cnb.api+json"                 -d "$PAYLOAD")
              echo "  重建 -> HTTP $CODE"
            fi

            case "$CODE" in
              2*) echo "版本已就绪"; exit 0 ;;
            esac
            echo "创建版本失败（HTTP $CODE）"; cat /tmp/resp.json; exit 1

        # ---------------------------------------------------------- 3. 挂附件
        #
        # 用官方附件插件传，不自己调 API：它做了分片、重试、以及
        # 「上传 URL 过期就重新申请」这些事 —— CNB 的 OpenAPI 给的上传
        # 凭证只有 10 秒有效期，自己写很容易在大文件上踩坑。
        #
        # tag_push 事件下**不用指定 tag**：插件默认拿 $CNB_BRANCH，
        # 也就是刚推上来的那个标签名，正好对应上一步建出来的 Release。
        - name: 上传安装包到 Release
          image: cnbcool/attachments:latest
          settings:
            # glob 而不是写死版本号：发新版本时这里不用改
            attachments:
              - "./dist-go/QuickFileDispatch-Setup-*.exe"
              - "./dist-go/QuickFileDispatch-[0-9]*.exe"
          exports:
            FILES: FILES

        # 把结果打出来 —— 插件成功但附件列表为空是可能的（glob 没匹配上，
        # 比如构建那步产物名变了），不看一眼根本发现不了。
        - name: 确认附件
          script: |
            if [ -z "$FILES" ]; then
              echo "附件列表是空的 —— 检查构建产物名与上面的 glob 是否对得上"
              ls -l dist-go/ || true
              exit 1
            fi
            echo "已挂载附件：$FILES"

        # ---------------------------------------------------------- 4. 清理
        #
        # 清理旧版本，**只留当前刚发的这一版**。
        #
        # 为什么非清不可：Release 附件存在对象存储里，一版一版堆下去白占额度
        #（2026-09-23 清掉了 6 个旧版本、约 330 MiB）。现在附件是自动传的，
        # 不清的话每发一版就多占 23 MB，比手工传的时代更容易失控。
        #
        # 保留规则（2026-10-10 起，定死的口径）：
        #   - **只有当前刚发的这一版**，其余全删（含 Electron 线 v2.8.0）。
        #     早先的规则是「v2.* 一律保留」，现在不再保留历史版本 ——
        #     一个仓库的 Release 页只该有「当前能用的那一版」。
        #
        # 清理失败不能让发版变红，所以脚本哪里出错都走 exit 0。
        - name: 清理旧版本
          script: |
            # 标签名拿不到就什么都不删 —— 判断依据全靠它，空值会把旧版误删
            if [ -z "$CNB_BRANCH" ]; then echo "拿不到 CNB_BRANCH，为安全起见不删任何东西"; exit 0; fi

            URL="${CNB_API_ENDPOINT}/${CNB_REPO_SLUG}/-/releases"
            curl -sS "$URL?pageSize=100" \
              -H "Authorization: Bearer ${CNB_TOKEN}" \
              -H "Accept: application/vnd.cnb.api+json" \
              -o /tmp/list.json || { echo "拉版本列表失败，跳过清理"; exit 0; }

            # 注意：这个接口返回的是**裸数组**，不是 {data:[...]}。
            # cnb CLI 打印出来的 data: 那层信封是它自己加的，照它写 jq 会报
            # "Cannot index array with string \"data\""。
            #
            # jq 只负责把「id + 标签名」拆成两列 —— 这个写法在 v2.8.0 发版时跑通过。
            # 留哪删哪的判断全在 shell 里，免得往 jq 里塞它版本不支持的函数。
            jq -r '.[] | "\(.id)\t\(.tag_name)"' /tmp/list.json |
            while IFS="$(printf '\t')" read -r RID TAG; do
              [ -z "$RID" ] && continue
              [ "$TAG" = "$CNB_BRANCH" ] && { echo "保留当前版本 ${TAG}"; continue; }

              CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE "$URL/$RID" \
                -H "Authorization: Bearer ${CNB_TOKEN}" \
                -H "Accept: application/vnd.cnb.api+json")
              echo "删除旧版本 $TAG -> HTTP $CODE"
            done
            exit 0
